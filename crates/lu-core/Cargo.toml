[package]
name = "lu-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Lu core: ANSF memory, effect journal and model boundary"
publish = false

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
calamine = "0.38.0"
pdf-extract = "0.12.1"
tar = "0.4.46"
flate2 = "1.1.11"
sevenz-rust2 = "0.20.2"
bzip2 = "0.6.1"
lzma-rust2 = "0.16.5"
crc32fast = "1.5.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_Performance",
  "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
lopdf = "0.42.0"
