[package]
name = "lu-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Lu desktop app"
publish = false

[[bin]]
name = "lu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lu-core = { path = "../lu-core" }
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
# Bundle the web files into the binary (release builds and installers).
custom-protocol = ["tauri/custom-protocol"]
